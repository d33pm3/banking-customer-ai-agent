name: Verify packaged-source coverage

on:
  push:
    branches:
      - chore/extract-tracked-source-and-ci

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify every legitimate archive file has a tracked root counterpart
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q Codebase.zip -d "$tmp"
          mapfile -t roots < <(find "$tmp" -mindepth 1 -maxdepth 1 -type d -print)
          test "${#roots[@]}" -eq 1
          app="${roots[0]}"

          echo 'Archive application root:'
          basename "$app"
          echo 'Archive top-level entries:'
          find "$app" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort

          missing=0
          while IFS= read -r -d '' file; do
            rel="${file#"$app/"}"
            case "$rel" in
              node_modules/*|dist/*|build/*|.git/*|.cache/*|coverage/*|.turbo/*|.next/*|.output/*|.vinxi/*|.nitro/*|.wrangler/*|.idea/*|.vscode/*|.DS_Store|Thumbs.db|.env|.env.*)
                continue
                ;;
            esac
            if [ ! -f "$rel" ]; then
              echo "::error::Missing tracked counterpart for archive file: $rel"
              missing=1
            fi
          done < <(find "$app" -type f -print0)

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
